<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yalliem - Link Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="bg.mp4" type="video/mp4">
        Browser kamu tidak mendukung pemutaran video.
    </video>

    <div class="container">
        <div class="profile-pic-wrapper">
            <img src="avatar.jpg" alt="Foto Profil Yalliem" class="profile-pic">
        </div>

        <h1 class="profile-name">Yalliem</h1>

        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-count" id="followers-count">0</span>
                <span class="stat-label">pengikut</span>
            </div>
            <span class="stat-dot">&bull;</span>
            <div class="stat-item">
                <span class="stat-count" id="following-count">0</span>
                <span class="stat-label">mengikuti</span>
            </div>
        </div>
        
        <p class="profile-bio">Semua informasi dan kontak Admin tersedia di sini.</p>
    </div>

</body>
</html>
